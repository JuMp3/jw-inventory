<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accedi')}"></head>
<body class="auth-page">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-sm-9 col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <div class="auth-logo"><i class="bi bi-book-half"></i></div>
                <h1 class="h4 mt-2 mb-0">Inventario Biblioteca</h1>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger py-2">Email o password non validi</div>
                    <div th:if="${param.logout}" class="alert alert-info py-2">Sei uscito correttamente</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" id="username" name="username" class="form-control form-control-lg"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control form-control-lg"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Accedi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
