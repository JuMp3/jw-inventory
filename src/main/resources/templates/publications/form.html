<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${publicationId == null} ? 'Nuova pubblicazione' : 'Modifica pubblicazione')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('publications')}"></nav>
<main class="container py-3 narrow">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/publications}">Pubblicazioni</a></li>
            <li class="breadcrumb-item active" th:text="${publicationId == null} ? 'Nuova' : 'Modifica'">Nuova</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3" th:text="${publicationId == null} ? 'Nuova pubblicazione' : 'Modifica pubblicazione'">Nuova pubblicazione</h1>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${publicationId == null} ? @{/publications/new} : @{/publications/{id}/edit(id=${publicationId})}"
                  th:object="${form}" method="post" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-sm-4">
                        <label for="code" class="form-label">Codice</label>
                        <input type="text" id="code" th:field="*{code}" class="form-control" maxlength="50"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" placeholder="es. lff" required autofocus>
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                    </div>
                    <div class="col-sm-8">
                        <label for="title" class="form-label">Titolo</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" maxlength="255"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                    </div>
                    <div class="col-sm-4" th:if="${publicationId == null}">
                        <label for="quantity" class="form-label">Copie presenti</label>
                        <input type="number" id="quantity" th:field="*{quantity}" class="form-control" min="0" placeholder="0"
                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{quantity}"></div>
                    </div>
                    <div class="col-12">
                        <label for="image" class="form-label">Immagine di copertina</label>
                        <div class="d-flex gap-3 align-items-start">
                            <div class="pub-thumb pub-thumb-lg">
                                <img id="image-preview" th:src="${imageUrl != null} ? @{${imageUrl}} : ''" th:hidden="${imageUrl == null}" alt="">
                                <i class="bi bi-image" th:hidden="${imageUrl != null}" data-preview-placeholder></i>
                            </div>
                            <div class="flex-grow-1">
                                <input type="file" id="image" name="image" class="form-control"
                                       accept="image/jpeg,image/png,image/webp,image/gif"
                                       data-max-bytes="2097152" data-preview="#image-preview">
                                <div class="form-text">JPEG, PNG, WebP o GIF, massimo 2 MB.</div>
                                <div class="form-check mt-2" th:if="${imageUrl != null}">
                                    <input class="form-check-input" type="checkbox" name="removeImage" value="true" id="removeImage">
                                    <label class="form-check-label" for="removeImage">Rimuovi immagine</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salva</button>
                    <a th:href="@{/publications}" class="btn btn-outline-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${publicationId != null}" class="card border-danger-subtle mt-4">
        <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div>
                <strong>Elimina pubblicazione</strong>
                <div class="small text-muted">Verranno cancellati anche lo storico dei movimenti e i conteggi di inventario.</div>
            </div>
            <form th:action="@{/publications/{id}/delete(id=${publicationId})}" method="post"
                  data-confirm="Eliminare definitivamente questa pubblicazione e il suo storico?">
                <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i> Elimina</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
