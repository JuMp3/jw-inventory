<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f5f6fa;font-family:Arial,Helvetica,sans-serif;color:#212529;">
<div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:#ffffff;border-radius:8px;padding:24px;">
        <h2 style="font-size:18px;margin:0 0 16px;" th:text="${subject}">Oggetto</h2>
        <p style="font-size:15px;line-height:1.6;margin:0;">
            <th:block th:each="line, stat : ${lines}"><span th:text="${line}"></span><br th:unless="${stat.last}"></th:block>
        </p>
    </div>
    <p style="font-size:12px;color:#868e96;text-align:center;margin:16px 0 0;">Notifica automatica · Inventario Biblioteca</p>
</div>
</body>
</html>
