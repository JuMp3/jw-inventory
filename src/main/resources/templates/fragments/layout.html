<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Biblioteca'">Biblioteca</title>
    <!-- Null-safe: _csrf is absent on the error dispatch -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/publications}"><i class="bi bi-book-half"></i> Biblioteca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'publications'} ? 'active'" th:href="@{/publications}">
                        <i class="bi bi-journals"></i> Pubblicazioni</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'inventory'} ? 'active'" th:href="@{/inventory}">
                        <i class="bi bi-clipboard-check"></i> Inventario</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'movements'} ? 'active'" th:href="@{/movements}">
                        <i class="bi bi-arrow-left-right"></i> Movimenti</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'notifications'} ? 'active'" th:href="@{/notifications}">
                        <i class="bi bi-bell"></i> Notifiche</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                    <a class="nav-link" th:classappend="${active == 'users'} ? 'active'" th:href="@{/admin/users}">
                        <i class="bi bi-people"></i> Utenti</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:classappend="${active == 'congregations'} ? 'active'" th:href="@{/superadmin/congregations}">
                        <i class="bi bi-diagram-3"></i> Congregazioni</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i> <span sec:authentication="name"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person"></i> Profilo</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right"></i> Esci</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <div id="app-toast" class="app-toast" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
